<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#040810"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Core ambient glow -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)"/>

  <!-- Outer HUD Ring with ticks -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="14 8" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Segmented ARC rings -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="60 20 40 20" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 14" stroke-opacity="0.7"/>

  <!-- Inner HUD Core -->
  <circle cx="256" cy="256" r="75" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-dasharray="80 30" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="45" fill="#38bdf8" fill-opacity="0.2" stroke="#bae6fd" stroke-width="3"/>
  
  <!-- Central Pulse Orb -->
  <circle cx="256" cy="256" r="24" fill="#ffffff" filter="url(#glow)"/>

  <!-- Crosshair accents -->
  <line x1="256" y1="56" x2="256" y2="86" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="426" x2="256" y2="456" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="86" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="426" y1="256" x2="456" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Corner Brackets -->
  <path d="M 90 130 L 90 90 L 130 90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5"/>
  <path d="M 422 130 L 422 90 L 382 90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5"/>
  <path d="M 90 382 L 90 422 L 130 422" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5"/>
  <path d="M 422 382 L 422 422 L 382 422" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5"/>
</svg>
